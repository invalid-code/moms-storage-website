name: CD

# Ships the backend only after CI passes on main:
#   1. builds the image and pushes it to invalidjess/moms-backend on Docker Hub
#      (tags :latest and :<commit-sha>), then
#   2. triggers the Render deploy hook.
#
# One-time setup:
#   1. Docker Hub -> Account Settings -> Personal access tokens -> generate a
#      token (read/write/delete is overkill; read+write suffices).
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> add:
#        DOCKERHUB_USERNAME  (your Docker Hub username)
#        DOCKERHUB_TOKEN     (the access token, never your password)
#        RENDER_DEPLOY_HOOK_URL (Render dashboard -> service -> Settings ->
#          Deploy Hook; keep Render Auto-Deploy Off so only this workflow ships)

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  ship:
    name: Push image and trigger Render deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      IMAGE: invalidjess/moms-backend
      SHA: ${{ github.event.workflow_run.head_sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check secrets are configured
        run: |
          missing=0
          for var in DOCKERHUB_USERNAME DOCKERHUB_TOKEN RENDER_DEPLOY_HOOK_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is not set. See the setup notes at the top of .github/workflows/cd.yml."
              missing=1
            fi
          done
          exit $missing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            invalidjess/moms-backend:latest
            invalidjess/moms-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy hook
        run: curl -fsS --retry 3 -X POST "$RENDER_DEPLOY_HOOK_URL"
