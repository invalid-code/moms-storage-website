# Local backend stack: API + MongoDB.
# Usage:
#   docker compose up --build        # foreground
#   docker compose up --build -d     # background
#   docker compose down              # stop (keeps mongo-data volume)
#   docker compose down -v           # stop and delete stored data
#
# The API is at http://localhost:5000/api (health: /api/health).
# Credentials below are dev-only; override with environment variables or an
# untracked .env file (see compose `env_file` docs) for anything shared.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      # Host 27018 to avoid clashing with a locally installed mongod on 27017.
      # The backend still reaches mongo on the internal 27017.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_DB_CONN_STR: mongodb://admin:password@mongo:27017/?authSource=admin
      FRONTEND_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      # Daily files are written to ./logs inside the container by default.
      # Uncomment the volume below to persist them on the host.
    # volumes:
    #   - ./backend-logs:/app/backend/logs
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "fetch('http://localhost:5000/api/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
